name: WhisperX Sandbox Relay Test

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/whisperx-sandbox-relay.yml

permissions:
  contents: read

jobs:
  relay-part-000:
    runs-on: ubuntu-latest
    steps:
      - name: Download Dropbox Part 000
        shell: bash
        run: |
          set -euo pipefail
          FILE='whisperx_transfer_bundle_20260802_215058.tar.gz.part-000'
          URL='https://dl.dropboxusercontent.com/scl/fi/j79uyhlr5nfgaiwamhtl4/whisperx_transfer_bundle_20260802_215058.tar.gz.part-000?rlkey=bkmv1cwkz0tr189fgz9hgqj93&st=fqkox571&dl=0'
          curl --fail --location --retry 3 --retry-delay 2 --output "$FILE" "$URL"
          test "$(stat -c %s "$FILE")" -eq 471859200
          printf '%s  %s\n' '6ed32753b072a536b8b353dbd5b0f3d4f9bcdd40f14f038a2ea9fb7076ee1e7d' "$FILE" | sha256sum --check --strict

      - name: Upload Relay Artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisperx-relay-part-000
          path: whisperx_transfer_bundle_20260802_215058.tar.gz.part-000
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
